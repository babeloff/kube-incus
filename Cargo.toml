[package]
name = "kubeincus"
version = "0.1.0"
edition = "2021"
authors = ["babeloff"]
description = "A bridge enabling KubeVirt to manage system-containers with Incus/LXD"
readme = "README.md"
repository = "https://github.com/babeloff/kube-incus"
license = "Apache-2.0"
keywords = ["kubernetes", "incus", "lxd", "kubevirt", "containers"]
categories = ["virtualization"]

[dependencies]
# Core dependencies will be added as the project develops
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Test dependencies

[profile.release]
strip = true
lto = true
codegen-units = 1
